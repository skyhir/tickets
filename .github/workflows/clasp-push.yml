name: Deploy to Apps Script (clasp)

# Auto-pushes the Apps Script project to Google whenever code that clasp
# tracks lands on main. Authentication uses the CLASPRC_JSON repo secret
# (the contents of a `clasp login` ~/.clasprc.json token file).
on:
  push:
    branches: [main]
    paths:
      - '**.gs'
      - '**.html'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/clasp-push.yml'
  workflow_dispatch: {}

# Never let two deploys race against the same Apps Script project.
concurrency:
  group: clasp-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set. Run 'clasp login' locally and store ~/.clasprc.json as the CLASPRC_JSON repo secret."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push to Apps Script
        run: npx clasp push --force
